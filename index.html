<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simpli City</title>


  <!-- ========================================

    ========================================= -->

  <link rel="stylesheet" href="asset/css/bootstrap.min.css">

<body>


  <!-- ========================================
         Header Section Start
    ========================================= -->

  <header class="header-section">

    <div class="container-fluid px-2 px-md-5">

      <nav class="navbar navbar-expand-lg custom-navbar">


        <!-- ========================================
                     Logo
                ========================================= -->

        <a class="navbar-brand logo-area" href="#">

          <img src="asset/images/logo.jpg" alt="Simplicity Logo">

        </a>


        <!-- ========================================
                     Mobile Toggle
                ========================================= -->

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
          aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">

          <span class="navbar-toggler-icon">

            <i class="fa-solid fa-bars"></i>

          </span>

        </button>


        <!-- ========================================
                     Navigation
                ========================================= -->

        <div class="collapse navbar-collapse" id="mainNavbar">


          <!-- Main Menu -->

          <ul class="navbar-nav mx-auto main-menu">


            <!-- Home -->

            <li class="nav-item">

              <a class="nav-link active" href="#">
                Home
              </a>

            </li>


            <!-- About -->

            <li class="nav-item">

              <a class="nav-link" href="#">
                About
              </a>

            </li>


            <!-- Solutions -->

            <li class="nav-item">

              <a class="nav-link" href="#">
                Solutions
              </a>

            </li>


            <!-- Clients -->

            <li class="nav-item">

              <a class="nav-link" href="#">
                Clients
              </a>

            </li>


            <!-- Contact -->

            <li class="nav-item">

              <a class="nav-link" href="#">
                Contact
              </a>

            </li>

          </ul>


          <!-- ========================================
                         Let's Talk Button
                    ========================================= -->

          <div class="header-action">
            <a href="#" class="talk-btn">

              <span class="talk-text">Let's Talk</span>

              <span class="talk-icon normal-icon">
                <i class="fa-solid fa-arrow-up-right"></i>
              </span>

              <span class="talk-icon hover-icon">
                <span class="fs-6">↗</span>
              </span>

            </a>
          </div>


        </div>

      </nav>

    </div>

  </header>

         Header Section End
    ========================================= -->

         Main Section Start
    ========================================= -->

           Hero Section Start
      ========================================= -->

    <section class="hero-section">

      <div class="hero-bg">
        <img src="asset/images/hero-bg.jpg" alt="Enterprise consulting team">
        <div class="hero-overlay"></div>
      </div>

      <div class="container px-2 px-md-5">



        <div class="hero-content">

          <span class="hero-badge">Enterprise Consulting</span>

          <h1 class="hero-title">
            Making Your Enterprise <br>
            Run Simply
          </h1>

          <p class="hero-desc">
            Orchestrating high-performance enterprise platforms,
            AI agent governance, and end-to-end digital transformation.
          </p>



          <div class="header-action">
            <a href="#" class="talk-btn px-3 py-3 hero-btn ">

              <span class="talk-text">Explore Our Solutions</span>

              <span class="talk-icon normal-icon">
                <i class="fa-solid fa-arrow-up-right"></i>
              </span>

              <span class="talk-icon hover-icon">
                <span class="fs-5">↗</span>
              </span>

            </a>
          </div>

        </div>

      </div>

    </section>

      ========================================= -->
